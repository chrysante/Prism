symbols:
  - name: Symbol
    abstract: true
    
  - name: Module
    base: Symbol

  - name: SourceFile
    base: Symbol

# Declarations

  - name: DeclSymbol
    base: Symbol
    abstract: true

  - name: StructDef
    base: DeclSymbol
    
  - name: TraitDef
    base: DeclSymbol

  - name: FunctionDef
    base: DeclSymbol

# Types

  - name: Type
    base: Symbol
    abstract: true

  - name: BuiltinType
    base: Type

  - name: StructInst
    base: Type

  - name: GenTypeParam
    base: Type

  - name: FunctionType
    base: Type

# Traits
 
  - name: Trait
    base: Symbol
    abstract: true
 
  - name: BuiltinTrait
    base: Trait
 
  - name: TraitInst
    base: Trait
    
# Values

  - name: Value
    base: Symbol
    abstract: true

  - name: User
    base: Value
    abstract: true

  - name: GenValueParam
    base: Value

  - name: FunctionArgument
    base: Value

# Functions

  - name: Function
    base: Value
    abstract: true

  - name: FunctionInst
    base: Function

# Instructions

  - name: Instruction
    base: User
    abstract: true
    
  - name: CallInst
    base: Instruction
