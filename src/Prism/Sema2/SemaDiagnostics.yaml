
diags:
  - name: UndeclaredID
    base: SemaDiagnostic
    kind: Error
    members:
      - name: similar
        type: Symbol const*
    ctor_body: indeclared_id_notes(*this, similar);
    header: >
      str << "Use of undeclared identifier '" << get_id(facet(), sourceContext())
          << "'";

  - name: AmbiguousNameLookup
    base: SemaDiagnostic
    kind: Error
    members:
      - name: symbols
        type: std::span<Symbol const* const>
        ctor_only: true
    ctor_body: >
      for (auto* symbol: symbols)
          add_note(sourceContext(), symbol->facet(), 
                   [symbol](std::ostream& str) {
              str << "Found " << pretty_name(get_rtti(*symbol)) << " '"
                  << format_name(symbol, { .qualified = true })
                  << "' declared here";
          });
    header: >
      str << "Multiple symbols found for identifier '"
          << get_id(facet(), sourceContext()) << "'";

  - name: Redefinition
    base: SemaDiagnostic
    kind: Error
    members:
      - name: name
        type: std::string
      - name: existing
        type: Symbol const*
        ctor_only: true
      - name: scope
        type: Scope const*
        ctor_only: true
    ctor_body: >
      add_note(sourceContext(), get_facet(*existing, scope),
               [=](std::ostream& str) {
          str << "Existing definition is here";
      });
    header: >
      str << "Redefition of name '" << name << "'";

  - name: FuncRedefinition
    base: SemaDiagnostic
    kind: Error
    members:
      - name: function
        type: FunctionDef const*
      - name: existing
        type: FunctionDef const*
        ctor_only: true
      - name: scope
        type: Scope const*
        ctor_only: true
    ctor_body: >
      add_note(sourceContext(), get_facet(*existing, scope), 
               [=](std::ostream& str) {
          str << "Existing definition is here";
      });
      if (function->return_type() != existing->return_type())
          add_note([=](std::ostream& str) {
              str << "Overloading on return type is not allowed";
          });
    header: >
      str << "Redefition of function '" << format_name(function) << "'";

  - name: TypeDefCycle
    base: SemaDiagnostic
    kind: Error
    comment: 'Cyclic structure definition'
    no_source: true
    members:
      - name: cycle
        type: std::span<Symbol const* const>
        ctor_only: true
    ctor_body: typedef_cycle_notes(*this, cycle);
    header: >
      str << "Detected a cycle in a type definition:";

  - name: BadSymRef
    base: SemaDiagnostic
    kind: Error
    members:
      - name: provided_symbol
        type: Symbol const*
      - name: expected_symbol_type
        type: SymbolType
    header: >
      str << "Expected " << pretty_name(expected_symbol_type) << ", have ";
      if (provided_symbol) 
          str << pretty_name(get_rtti(*provided_symbol)) << " ";
      str << format_name(provided_symbol);

  - name: BadGenTypeArg
    base: SemaDiagnostic
    kind: Error
    members:
      - name: argument
        type: Type const*
      - name: trait_bound
        type: Trait const*
    header: >
      utl::streammanip arg_name([&](std::ostream& str) {
          if (isa<GenTypeParam>(argument))
              str << format_decl(argument);
          else
              str << format_name(argument);
      });
      str << "Type argument " << arg_name << " does not conform to "
          << format_name(trait_bound);

  - name: ThisParamBadPosition
    base: SemaDiagnostic
    kind: Error
    header: >
      str << "'this' must be the first parameter";

  - name: ThisParamFreeFunction
    base: SemaDiagnostic
    kind: Error
    header: >
      str << "'this' cannot appear in non-member functions";

  - name: InvalidNumOfCallArgs
    base: SemaDiagnostic
    kind: Error
    members:
      - name: callee
        type: Symbol const*
      - name: num_params
        type: size_t
      - name: num_arguments
        type: size_t
    header: >
      str << "called function " << format_name(callee) << " expects " 
          << num_params << " arguments, found " << num_arguments;

  - name: InvalidNumOfGenArgs
    base: SemaDiagnostic
    kind: Error
    members:
      - name: generic
        type: DeclSymbol const*
      - name: num_arguments
        type: size_t
    header: >
      str << "generic " << format_name(generic) << " expects " 
          << generic->num_generic_params() << " arguments, found " 
          << num_arguments;

  - name: NoMatchingFunction
    base: SemaDiagnostic
    kind: Error
    members:
      - name: name
        type: std::string
    header: >
      str << "no matching function for call to " << name;

  - name: AmbiguousCall
    base: SemaDiagnostic
    kind: Error
    members:
      - name: name
        type: std::string
    header: >
      str << "ambiguous call to " << name;
     

  - name: BadOperandType
    base: SemaDiagnostic
    kind: Error
    members:
      - name: operand
        type: Value const*
      - name: expected_type
        type: Type const*
    header: >
      str << "expected operand of type " << format_name(expected_type) 
          << ", found " << format_name(operand->type());
          
  - name: BindingMissingTypespec
    base: SemaDiagnostic
    kind: Error
    members:
      - name: name
        type: std::string
    header: >
      str << "binding " << name << " requires a type specifier";

  - name: BindingMissingInit
    base: SemaDiagnostic
    kind: Error
    members:
      - name: name
        type: std::string
    header: >
      str << "binding " << name << " requires an initializer";

  - name: SymbolNotCallable
    base: SemaDiagnostic
    kind: Error
    members:
      - name: provided_symbol
        type: Symbol const*
    header: >
        if (auto* value = dyncast<Value const*>(provided_symbol))
            str << "value of type " << format_name(value->type()) 
                << " is not callable";
        else 
            str << format_name(provided_symbol) << " is not callable";

  - name: GenericMemberInTrait
    base: SemaDiagnostic
    kind: Error
    members:
      - name: member
        type: DeclSymbol const*
    header: >
        str << "trait member " << format_name(member) << " cannot be generic";

  - name: NoThisInTraitFunction
    base: SemaDiagnostic
    kind: Error
    members:
      - name: trait_function
        type: FunctionDef const*
    header: >
        str << "no 'this' parameter in trait function " 
            << format_name(trait_function);

  - name: UnmatchedTraitImpl
    base: SemaDiagnostic
    kind: Error
    members:
      - name: trait
        type: Trait const*
      - name: member
        type: DeclSymbol const*
    header: >
        str << "implementation member " << format_name(member)
            << " does not match any declaration in "
            << format_name(trait);
            
  - name: IncompleteTraitImpl
    base: SemaDiagnostic
    kind: Error
    members:
      - name: impl
        type: TraitImplDef const*
      - name: missing_impls
        type: std::span<DeclSymbol const* const>
    ctor_body: >
      incomplete_impl_notes(*this, missing_impls);
    header: >
      str << "trait implementation " << format_name(impl->trait())
          << " for " << format_name(impl->type())
          << " is incomplete"; 
 
