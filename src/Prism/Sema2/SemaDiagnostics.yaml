
diags:
  - name: UndeclaredID
    base: SemaDiagnostic
    kind: Error
    members:
      - name: similar
        type: Symbol const*
    ctor_body: indeclared_id_notes(*this, similar);
    header: >
      str << "Use of undeclared identifier '" << get_id(facet(), sourceContext())
          << "'";

  - name: AmbiguousNameLookup
    base: SemaDiagnostic
    kind: Error
    members:
      - name: symbols
        type: std::span<Symbol const* const>
        ctor_only: true
    ctor_body: >
      for (auto* symbol: symbols)
          add_note(symbol->facet(), [symbol](std::ostream& str) {
              str << "Found " << pretty_name(get_rtti(*symbol)) << " '"
                  << format_name(symbol, { .qualified = true })
                  << "' declared here";
          });
    header: >
      str << "Multiple symbols found for identifier '"
          << get_id(facet(), sourceContext()) << "'";

  - name: Redefinition
    base: SemaDiagnostic
    kind: Error
    members:
      - name: name
        type: std::string_view
      - name: existing
        type: Symbol const*
        ctor_only: true
    ctor_body: >
      add_note(existing->facet(), [=](std::ostream& str) {
          str << "Existing declaration is here";
      });
    header: >
      str << "Redefition of name '" << name << "'";

  - name: FuncRedefinition
    base: SemaDiagnostic
    kind: Error
    members:
      - name: function
        type: FunctionDef const*
      - name: existing
        type: FunctionDef const*
        ctor_only: true
    ctor_body: >
      add_note(existing->facet(), [=](std::ostream& str) {
          str << "Existing declaration is here";
      });
      if (function->return_type() != existing->return_type())
          add_note([=](std::ostream& str) {
              str << "Overloading on return type is not allowed";
          });
    header: >
      str << "Redefition of function '" << format_name(function) << "'";

  - name: TypeDefCycle
    base: SemaDiagnostic
    kind: Error
    comment: 'Cyclic structure definition'
    no_source: true
    members:
      - name: cycle
        type: std::span<Symbol const* const>
        ctor_only: true
    ctor_body: typedef_cycle_notes(*this, cycle);
    header: >
      str << "Detected a cycle in a type definition:";

  - name: BadSymRef
    base: SemaDiagnostic
    kind: Error
    members:
      - name: provided_symbol
        type: Symbol const*
      - name: expected_symbol_type
        type: SymbolType
    header: >
      str << "Expected " << pretty_name(expected_symbol_type) << ", have ";
      if (provided_symbol) 
          str << pretty_name(get_rtti(*provided_symbol)) << " ";
      str << format_name(provided_symbol);

  - name: InvalidNumOfGenArgs
    base: SemaDiagnostic
    kind: Error
    members:
      - name: decl_symbol
        type: DeclSymbol const*
      - name: num_args
        type: size_t
    header: >
      size_t num_params = decl_symbol->generic_params().size();
      str << "Generic " << get_gen_symbol_category_name(decl_symbol) << " "
          << format_name(decl_symbol) << " requires "
          << pluralize(num_params, "argument") << ", have "
          << num_to_word(num_args);

  - name: BadGenTypeArg
    base: SemaDiagnostic
    kind: Error
    members:
      - name: argument
        type: Type const*
      - name: trait_bound
        type: Trait const*
    header: >
      utl::streammanip arg_name([&](std::ostream& str) {
          if (isa<GenTypeParam>(argument))
              str << format_decl(argument);
          else
              str << format_name(argument);
      });
      str << "Type argument " << arg_name << " does not conform to "
          << format_name(trait_bound);

  - name: ThisParamBadPosition
    base: SemaDiagnostic
    kind: Error
    header: >
      str << "'this' must be the first parameter";

  - name: ThisParamFreeFunction
    base: SemaDiagnostic
    kind: Error
    header: >
      str << "'this' cannot appear in non-member functions";

  - name: InvalidNumOfCallArgs
    base: SemaDiagnostic
    kind: Error
    members:
      - name: callee
        type: Function const*
      - name: num_arguments
        type: size_t
    header: >
      str << "called function " << format_name(callee) << " expects " 
          << callee->num_arguments() << " arguments, found " << num_arguments;

  - name: BadOperandType
    base: SemaDiagnostic
    kind: Error
    members:
      - name: operand
        type: Value const*
      - name: expected_type
        type: Type const*
    header: >
      str << "expected operand of type " << format_name(expected_type) 
          << ", found " << format_name(operand->type());

